services:
  db:
    image: postgres:16-alpine
    container_name: emailtriage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: emailtriage
      POSTGRES_USER: emailtriage
      POSTGRES_PASSWORD: emailtriage_dev
    ports:
      - "5432:5432"
    volumes:
      - emailtriage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailtriage -d emailtriage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  emailtriage_pgdata:

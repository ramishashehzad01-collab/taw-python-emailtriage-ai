services:
  - type: web
    name: taw-python-emailtriage-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: EmailTriage AI
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      - key: GMAIL_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: emailtriage-postgres
          property: connectionString

databases:
  - name: emailtriage-postgres
    databaseName: emailtriage
    user: emailtriage
    plan: free
